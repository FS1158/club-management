<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清华附中社团考勤系统 - 使用演示</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --thu-purple:#660874; --thu-purple-light:#8B2F9E; --thu-purple-lightest:#F5EBF8;
  --thu-gradient:linear-gradient(135deg,#660874,#8B2F9E);
  --success:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-300:#d1d5db; --gray-400:#9ca3af; --gray-500:#6b7280; --gray-700:#374151; --gray-800:#1f2937;
}
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f0f0f5; color:#1f2937; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; padding:20px; }
.demo-wrap { display:flex; gap:32px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }

/* 手机模拟框 */
.phone {
  width:375px; height:720px; background:#fff; border-radius:36px; border:8px solid #1a1a1a;
  box-shadow:0 8px 40px rgba(0,0,0,0.15); overflow:hidden; position:relative; flex-shrink:0;
}
.phone-notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:150px; height:24px; background:#1a1a1a; border-radius:0 0 16px 16px; z-index:100; }
.phone-screen { width:100%; height:100%; overflow:hidden; position:relative; background:#fff; }

/* 模拟界面通用样式 */
.sim-page { width:100%; height:100%; display:flex; flex-direction:column; }
.sim-header { background:var(--thu-gradient); color:#fff; padding:40px 16px 12px; display:flex; align-items:center; justify-content:space-between; }
.sim-header h1 { font-size:18px; font-weight:600; }
.sim-body { flex:1; overflow-y:auto; padding:12px; }
.sim-card { background:#fff; border:1px solid var(--gray-200); border-radius:12px; padding:14px; margin-bottom:12px; }
.sim-tab-bar { display:flex; border-bottom:2px solid var(--gray-200); padding:0 4px; background:#fff; }
.sim-tab { padding:10px 14px; font-size:12px; color:var(--gray-500); border-bottom:2px solid transparent; margin-bottom:-2px; }
.sim-tab.active { color:var(--thu-purple); border-bottom-color:var(--thu-purple); font-weight:600; }
.sim-input { width:100%; height:44px; border:1px solid var(--gray-300); border-radius:8px; padding:0 12px; font-size:14px; outline:none; }
.sim-input:focus { border-color:var(--thu-purple); }
.sim-btn { height:44px; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; width:100%; }
.sim-btn-primary { background:var(--thu-gradient); color:#fff; }

/* 解说面板 */
.narration { width:360px; flex-shrink:0; }
.narration-card { background:#fff; border-radius:16px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
.narration-title { font-size:18px; font-weight:600; color:var(--thu-purple); margin-bottom:12px; }
.narration-text { font-size:15px; line-height:1.8; color:var(--gray-700); min-height:120px; }
.narration-step { display:inline-block; background:var(--thu-purple-lightest); color:var(--thu-purple); font-size:12px; padding:3px 10px; border-radius:20px; margin-bottom:12px; font-weight:600; }
.progress-bar { width:100%; height:6px; background:var(--gray-200); border-radius:3px; margin-top:16px; overflow:hidden; }
.progress-fill { height:100%; background:var(--thu-gradient); border-radius:3px; transition:width 0.3s; }
.progress-dots { display:flex; gap:6px; margin-top:10px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--gray-300); }
.dot.done { background:var(--thu-purple-light); }
.dot.current { background:var(--thu-purple); width:24px; border-radius:4px; }

/* 控制按钮 */
.controls { display:flex; gap:10px; margin-top:16px; }
.ctrl-btn { flex:1; height:44px; border:1px solid var(--gray-300); border-radius:8px; background:#fff; font-size:14px; color:var(--gray-700); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:all 0.2s; }
.ctrl-btn:hover { border-color:var(--thu-purple); color:var(--thu-purple); }
.ctrl-btn.primary { background:var(--thu-gradient); color:#fff; border:none; }

/* 动画效果 */
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.fade-in { animation:fadeIn 0.4s ease; }
@keyframes typing { from{opacity:0} to{opacity:1} }
@keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }
.pulse { animation:pulse 0.3s ease; }
@keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
.slide-in { animation:slideIn 0.3s ease; }
@keyframes typingCursor { 0%,50%{opacity:1} 51%,100%{opacity:0} }
.cursor::after { content:'|'; animation:typingCursor 0.8s infinite; color:var(--thu-purple); }

/* 统计卡片 */
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.stat-item { background:var(--thu-purple-lightest); border-radius:10px; padding:12px; text-align:center; }
.stat-num { font-size:24px; font-weight:700; color:var(--thu-purple); }
.stat-label { font-size:11px; color:var(--gray-500); margin-top:2px; }

/* 学生列表 */
.student-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--gray-100); }
.student-info { display:flex; align-items:center; gap:8px; }
.student-avatar { width:32px; height:32px; border-radius:50%; background:var(--thu-purple-lightest); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--thu-purple); font-weight:600; }
.student-name { font-size:14px; }
.student-id { font-size:11px; color:var(--gray-400); }
.att-btns { display:flex; gap:4px; }
.att-btn { padding:4px 10px; border-radius:6px; font-size:12px; border:1px solid var(--gray-300); background:#fff; cursor:pointer; }
.att-btn.on-present { background:var(--success); color:#fff; border-color:var(--success); }
.att-btn.on-late { background:var(--warning); color:#fff; border-color:var(--warning); }
.att-btn.on-absent { background:var(--danger); color:#fff; border-color:var(--danger); }

/* 社团项 */
.club-item { display:flex; align-items:center; justify-content:space-between; padding:12px; border:1px solid var(--gray-200); border-radius:10px; margin-bottom:8px; }

/* 导出卡片 */
.export-card { display:flex; align-items:center; gap:12px; padding:16px; border:1px solid var(--gray-200); border-radius:12px; cursor:pointer; margin-bottom:8px; }
.export-icon { width:48px; height:48px; border-radius:12px; background:var(--thu-purple-lightest); display:flex; align-items:center; justify-content:center; font-size:24px; }

/* 搜索框 */
.search-box { display:flex; align-items:center; gap:8px; background:var(--gray-100); border-radius:10px; padding:8px 12px; margin-bottom:12px; }

/* 校徽 */
.school-logo { width:56px; height:56px; border-radius:50%; background:var(--thu-purple-lightest); display:flex; align-items:center; justify-content:center; margin:0 auto 8px; font-size:28px; }

@media(max-width:820px){
  .demo-wrap{flex-direction:column;align-items:center}
  .narration{width:375px}
}

/* 手机端适配 */
@media(max-width:480px){
  body{padding:8px}
  .demo-wrap{gap:12px}
  .phone{width:280px;height:540px;border-width:6px;border-radius:28px}
  .phone-notch{width:110px;height:18px}
  .narration{width:100%}
  .narration-card{padding:16px}
  .narration-title{font-size:16px;margin-bottom:8px}
  .narration-text{font-size:13px;line-height:1.7;min-height:80px}
  .narration-step{font-size:11px;padding:2px 8px;margin-bottom:8px}
  .sim-header{padding:28px 12px 10px}
  .sim-header h1{font-size:15px}
  .sim-body{padding:10px}
  .sim-card{padding:10px}
  .stat-num{font-size:20px}
  .stat-label{font-size:10px}
  .student-name{font-size:13px}
  .student-id{font-size:10px}
  .student-avatar{width:28px;height:28px;font-size:10px}
  .att-btn{padding:3px 8px;font-size:11px}
  .ctrl-btn{height:40px;font-size:13px}
  .progress-dots{flex-wrap:wrap;justify-content:center}
}
</style>
</head>

// ============ 播放逻辑 ============
let currentStep = 0;
let isPlaying = true;
let timer = null;
let typeTimer = null;

const screen = document.getElementById('screen');
const stepBadge = document.getElementById('stepBadge');
const stepTitle = document.getElementById('stepTitle');
const stepText = document.getElementById('stepText');
const progressFill = document.getElementById('progressFill');
const progressDots = document.getElementById('progressDots');
const playBtn = document.getElementById('playBtn');

// 初始化进度点
function initDots() {
  progressDots.innerHTML = '';
  for (let i = 0; i < steps.length; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.onclick = () => goToStep(i);
    progressDots.appendChild(d);
  }
}

function updateDots() {
  const dots = progressDots.children;
  for (let i = 0; i < dots.length; i++) {
    dots[i].className = 'dot' + (i < currentStep ? ' done' : (i === currentStep ? ' current' : ''));
  }
}

// 打字机效果
function typeText(element, text, callback) {
  clearTimeout(typeTimer);
  element.innerHTML = '';
  element.classList.add('cursor');
  let i = 0;
  function type() {
    if (i < text.length) {
      element.innerHTML = text.substring(0, i + 1);
      i++;
      typeTimer = setTimeout(type, 25);
    } else {
      element.classList.remove('cursor');
      if (callback) callback();
    }
  }
  type();
}

function renderStep(index) {
  const step = steps[index];
  screen.innerHTML = step.render();
  stepBadge.textContent = `步骤 ${index + 1} / ${steps.length}`;
  stepTitle.textContent = step.title;
  typeText(stepText, step.text);
  progressFill.style.width = `${((index + 1) / steps.length) * 100}%`;
  updateDots();
}

function nextStep() {
  if (currentStep < steps.length - 1) {
    currentStep++;
    renderStep(currentStep);
    resetTimer();
  } else {
    // 播放结束
    isPlaying = false;
    playBtn.textContent = '重新播放';
    clearTimeout(timer);
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderStep(currentStep);
    resetTimer();
  }
}

function goToStep(index) {
  currentStep = index;
  renderStep(currentStep);
  resetTimer();
}

function resetTimer() {
  clearTimeout(timer);
  if (isPlaying) {
    timer = setTimeout(nextStep, DURATION);
  }
}

function togglePlay() {
  if (currentStep === steps.length - 1 && !isPlaying) {
    // 重新播放
    currentStep = 0;
    isPlaying = true;
    renderStep(currentStep);
    resetTimer();
    playBtn.textContent = '暂停';
    return;
  }
  isPlaying = !isPlaying;
  if (isPlaying) {
    resetTimer();
    playBtn.textContent = '暂停';
  } else {
    clearTimeout(timer);
    playBtn.textContent = '播放';
  }
}

// 键盘控制
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prevStep();
  if (e.key === 'ArrowRight') nextStep();
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});

// 启动
initDots();
renderStep(0);
resetTimer();
</script>
